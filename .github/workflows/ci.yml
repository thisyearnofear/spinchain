name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint (changed), Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ratchet: lint only the app TS/TSX changed in this PR. This blocks any
      # NEW error (including react-hooks/rules-of-hooks — the crash that has
      # shipped twice). A full-project run is clean of errors today (warnings
      # only) and is available via `pnpm lint`.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        env:
          # Event fields go through the environment, never into the command: a
          # branch name may contain shell metacharacters, and `${{ }}` expansion
          # happens before the shell sees the line.
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="origin/$BASE_REF"
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE"...HEAD -- 'app/**/*.ts' 'app/**/*.tsx')
          if [ -z "$FILES" ]; then
            echo "No changed app TS/TSX files to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$FILES"
          # shellcheck disable=SC2086
          pnpm exec eslint $FILES

      # Reward gate tripwire. Live claims are not approved — the deployed
      # verifier wrapper rejects real proofs, and the app-side gate needs the
      # literal string "true" AND chain 43113 (app/lib/rewards/legacy-policy.ts),
      # so absent means off. Every committed reference currently says false; this
      # fails the day one of them stops saying so. It cannot see Vercel's project
      # variables, which is a deploy-time check, not a repo check.
      - name: Legacy reward claims stay gated off
        run: |
          if grep -rEn 'ENABLE_LEGACY_REWARD_CLAIMS[^a-zA-Z0-9]*[Tt]rue' \
              .env.example .env.local.template playwright.config.ts .github; then
            echo "::error::NEXT_PUBLIC_ENABLE_LEGACY_REWARD_CLAIMS must stay false until the deployed verifier accepts real proofs."
            exit 1
          fi
          echo "Legacy claim gate is off in every committed reference."

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

  e2e:
    name: Build + wedge/browser smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned @playwright/test 1.62.1 — install matching browser binaries.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Production build + wedge guard + browser smoke on desktop and mobile
      # (projects are defined in playwright.config.ts).
      - name: E2E gate
        run: pnpm test:e2e

  contracts:
    name: EVM verifier tests (forge v1.5.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # The committed lockfile has a pre-existing peer conflict
      # (hardhat-toolbox wants ethers@5, root pins ethers@6), so `npm ci`
      # fails on clean checkouts. The forge tests only need the locked prod
      # dependency — install it standalone without resolving the dev tree.
      - name: Install contract dependencies
        working-directory: contracts/evm
        run: |
          mkdir depstmp && cd depstmp
          npm init -y >/dev/null
          npm install @openzeppelin/contracts@5.0.2 --no-audit --no-fund
          mkdir -p ../node_modules
          cp -r node_modules/@openzeppelin ../node_modules/
          cd .. && rm -rf depstmp

      # forge-std is vendored locally but untracked — install the exact
      # pinned tag on clean checkouts.
      - name: Install forge-std
        working-directory: contracts/evm
        run: forge install --no-git foundry-rs/forge-std@v1.15.0

      - name: Build honk artifact
        working-directory: contracts/evm
        run: FOUNDRY_PROFILE=honk forge build --skip test --skip script

      - name: Run verifier tests
        working-directory: contracts/evm
        run: forge test --match-contract 'EffortThresholdVerifier.*'

      # Tripwire on the live Fuji deployment. `E2EFujiDeployment.t.sol` has
      # always existed and has never run in CI: it needs an explicit
      # --fork-url, and its comment claiming foundry.toml supplies one is
      # wrong — without the flag the fork is inactive and 6 of its 7 tests fail
      # with "no code", which is how a checked fact became a README sentence.
      # Pinned to a block so the result cannot drift with chain state; bump
      # FORK_BLOCK alongside a new deployment. Public RPC, no secrets.
      - name: Verify deployed contracts on Fuji fork
        working-directory: contracts/evm
        run: forge test --match-contract 'E2EFujiDeployment' --fork-url fuji --fork-block-number 59084300 -vv

  rive:
    name: Rive verify + goldens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rive CLI
        run: curl -fsSL https://releases.rive.app/cli/install.sh | bash

      # The CLI links against EGL for headless rendering; ubuntu-latest
      # doesn't ship it (libEGL.so.1: cannot open shared object file).
      - name: Install EGL libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2

      # Offline, no login needed: --verify/--once/--screenshot/--data-dump
      # never touch the network. Mirrors `pnpm rive:verify` without node.
      - name: Verify all Rive projects
        run: |
          export PATH="$HOME/.rive/bin:$PATH"
          rive rive/rider --verify
          rive rive/effort-aura --verify
          rive rive/coach-orb --verify
          rive rive/flow-badge --verify

      # Headless drive check: proves the view-model properties the wrappers
      # set are addressable and flip the state machines.
      - name: Drive view models headless
        run: |
          export PATH="$HOME/.rive/bin:$PATH"
          rive rive/rider --data="isRiding=true" --data-dump=- | grep -q '"changed": true'
          rive rive/effort-aura --data="intensity=0.9" --data-dump=- | grep -q '"changed": true'
          rive rive/coach-orb --data="emotion=2" --data-dump=- | grep -q '"changed": true'
          rive rive/flow-badge --data="flowTier=3" --data-dump=- | grep -q '"changed": true'

      - name: Render screenshot goldens
        run: |
          export PATH="$HOME/.rive/bin:$PATH"
          mkdir -p rive-goldens
          rive rive/rider --screenshot=rive-goldens/rider.png
          rive rive/effort-aura --screenshot=rive-goldens/effort-aura.png
          rive rive/coach-orb --screenshot=rive-goldens/coach-orb.png --advance=15
          rive rive/flow-badge --screenshot=rive-goldens/flow-badge.png

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: rive-goldens
          path: rive-goldens/
          retention-days: 14
