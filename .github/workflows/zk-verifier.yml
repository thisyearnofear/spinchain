name: ZK Circuit Check

# This workflow used to be called "ZK Verifier Generation", and its last step
# committed `contracts/evm/UltraVerifier.sol` straight to main on any
# `circuits/**` push. Two things were wrong with that, and both are why it has
# been red and idle since June:
#
#   1. The committed verifier is not generated output. Its own header says it is
#      a hand-written interface stub ("Until `bb` produces an EVM-compatible
#      verifier, this production stub enforces the correct interface and reverts
#      on uninitialized verification keys"), so comparing it against
#      `bb contract` output can never pass and regenerating it would clobber a
#      deliberate stub with an unusable file — on main, which has no protection.
#   2. The install steps did not install anything. `curl -L https://noirup.dev |
#      bash` could not resolve that host, and because the failure was on the left
#      of a pipe, `bash` read an empty stdin and exited 0. The step reported
#      success and `nargo compile` died with 127 four seconds later. The barretenberg
#      step only installed `bbup`, which still needs running to get `bb`.
#
# So this file now checks the one thing it can check honestly and repeatably: the
# circuit compiles and its Noir tests pass, on a pinned toolchain. Whether the
# deployment is what we say it is lives in ci.yml's contracts job, which runs
# `E2EFujiDeployment` against the public Fuji RPC pinned to a block — the first
# time those seven fork tests have ever run in CI, because they silently need an
# explicit `--fork-url` that no one was passing.
#
# Still unchecked, and recorded as the next step rather than as a claim: README:48
# says the deployed `EffortThresholdVerifier` wrapper forwards the wrong
# public-input slice and so reverts on real proofs while the underlying Honk
# verifier accepts them. `test/fixtures/effort_proof.json` has real proofs, so
# that sentence can become a fork assertion — one test per side. Until it does,
# no job here should say it verified a wrapper it has never called.

on:
  pull_request:
    paths:
      - 'circuits/**'
      - '.github/workflows/zk-verifier.yml'
  workflow_dispatch:

jobs:
  circuit:
    name: Compile circuit & run Noir tests
    runs-on: ubuntu-latest

    env:
      # Pinned, and pinned to the version this circuit is developed against
      # locally (nargo 1.0.0-beta.22). `circuits/effort_threshold/Nargo.toml`
      # only requires `>=0.33.0`, which is not a constraint anyone can build
      # reproducibly from.
      NOIR_VERSION: 1.0.0-beta.22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Nargo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noir"
          # -f matters: without it a 404 or a dead host leaves an empty file,
          # tar fails, and the previous version of this step reported green.
          curl -fSL --retry 3 -o "$RUNNER_TEMP/noir.tar.gz" \
            "https://github.com/noir-lang/noir/releases/download/v${NOIR_VERSION}/noir-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/noir.tar.gz" -C "$RUNNER_TEMP/noir"
          echo "$RUNNER_TEMP/noir" >> "$GITHUB_PATH"
          nargo --version

      - name: Compile circuit
        working-directory: circuits/effort_threshold
        run: nargo compile

      - name: Run circuit tests
        working-directory: circuits/effort_threshold
        run: nargo test
