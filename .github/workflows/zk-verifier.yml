name: ZK Verifier Generation

on:
  pull_request:
    paths:
      - 'circuits/**'
      - 'contracts/evm/UltraVerifier.sol'
      - '.github/workflows/zk-verifier.yml'
  workflow_dispatch:

jobs:
  generate-verifier:
    name: Compile Circuit & Check Committed Verifier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO(ci): these installs are unpinned — `noirup` and `bb` from master.
      # That means the same circuit can generate different Solidity on two
      # different days, so a "matches the committed verifier" pass is weaker
      # than it looks. Pinning `bb` to a release tag is the fix; it needs the
      # tag this circuit was actually generated with, which nothing currently
      # records.
      - name: Install Nargo
        run: |
          curl -L https://noirup.dev | bash
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH

      - name: Install Barretenberg (bb)
        run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/cpp/installation/install | bash
          echo "$HOME/.bb" >> $GITHUB_PATH

      - name: Compile circuit
        working-directory: circuits/effort_threshold
        run: nargo compile

      - name: Run circuit tests
        working-directory: circuits/effort_threshold
        run: nargo test

      - name: Generate verification key
        working-directory: circuits/effort_threshold
        run: bb write_vk -b target/effort_threshold.json -o target/vk

      - name: Generate Solidity verifier
        working-directory: circuits/effort_threshold
        # Into target/, which circuits/*/target/ already gitignores: the
        # committed verifier must not be the output path, or nothing would tell
        # a stale verifier apart from a freshly generated one.
        run: bb contract -k target/vk -o target/UltraVerifier.generated.sol

      # This used to commit straight to main on every circuits/** push. A job
      # that rewrites a money-gating verifier on main with no review is not a
      # check, it is a second write path around one.
      - name: Fail if the committed verifier is stale
        run: |
          if ! diff -q contracts/evm/UltraVerifier.sol circuits/effort_threshold/target/UltraVerifier.generated.sol >/dev/null; then
            echo "::error::contracts/evm/UltraVerifier.sol does not match what this circuit generates. Commit the regenerated file from the uploaded artifact."
            diff -u contracts/evm/UltraVerifier.sol circuits/effort_threshold/target/UltraVerifier.generated.sol | head -60 || true
            exit 1
          fi
          echo "Committed UltraVerifier.sol matches the circuit."

      - name: Upload verifier artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-verifier-sol
          path: circuits/effort_threshold/target/UltraVerifier.generated.sol
          if-no-files-found: ignore
          retention-days: 90
