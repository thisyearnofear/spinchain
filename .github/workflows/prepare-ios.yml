name: Prepare iOS Build

# Dispatch-only. This job prepares the native iOS shell for Xcode Cloud; it is
# not a signal about a push to main, and running it on every push turned a
# manual release step into a permanent red badge on main.
on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare iOS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # No --ignore-scripts: the postinstall step copies the Rive wasm runtime,
      # and a shell prepared without it builds and then fails at runtime.
      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # The app loads the deployed site over the network (Capacitor
      # remote-server mode) because Next.js cannot static-export 33 API routes.
      # In that mode webDir content is never loaded, but the Capacitor CLI still
      # validates that the directory named in capacitor.config.ts exists — so
      # this creates it, and does not pretend to build a web bundle nobody uses.
      - name: Verify remote server URL is configured
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "::error::CAPACITOR_SERVER_URL repo variable is not set. Set it to the deployed app origin (e.g. https://spinchain.vercel.app) — the iOS shell loads the app from there."
            exit 1
          fi
          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *) echo "::error::CAPACITOR_SERVER_URL must be an https:// origin, got: $CAPACITOR_SERVER_URL"; exit 1 ;;
          esac

      - name: Prepare webDir for remote-server mode
        run: |
          mkdir -p out
          printf '<!doctype html><meta charset="utf-8"><title>SpinChain</title>' > out/index.html

      - name: Sync Capacitor
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
        run: pnpm exec cap sync ios

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios/
          retention-days: 2

      - name: Create deployment tag
        run: |
          {
            echo "## iOS Build Ready"
            echo ""
            echo "Shell configured to load \`$CAPACITOR_SERVER_URL\`."
            echo ""
            echo "To build with Xcode Cloud:"
            echo "1. Open Xcode"
            echo "2. Go to Xcode > Settings > Accounts"
            echo "3. Add your Apple Developer account"
            echo "4. Open the workspace: ios/App.xcworkspace"
            echo "5. Product > Archive to start Xcode Cloud build"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
