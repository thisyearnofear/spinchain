allowBuilds:
  bufferutil: false
  keccak: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
overrides:
  # braces has no patched release (GHSA-vfj7-8cjw-p6xm). This plugin only
  # calls globSync(pattern, { onlyDirectories }), which tinyglobby matches.
  "@next/eslint-plugin-next>fast-glob": "npm:tinyglobby@^0.2.15"
  # viem pins ws exactly; force the patched 8.x line.
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  # uuid <11.1.1 (GHSA buffer bounds). Every consumer (xcode, @metamask/*,
  # jayson, rpc-websockets) only calls v1/v4, which 11.x still ships as CJS+ESM.
  "uuid@<11.1.1": "^11.1.1"
